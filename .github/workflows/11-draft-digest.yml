name: opencode-draft-digest

on:
  workflow_dispatch:      # one-off test, like Run now
  schedule:
    - cron: "0 9 * * *"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: anomalyco/opencode/github@latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: "Follow the skill at loop-engineering/11-build-the-two-routine-gate/.opencode/skills/draft-daily-digest/SKILL.md to draft today's digest."
