name: opencode-data-collector

on:
  workflow_dispatch: # manual "Run now" — the OpenCode equivalent of a Routine's one-off run

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure git identity
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"
      - uses: anomalyco/opencode/github@latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: "Follow the skill at loop-engineering/10-the-secrets-drill/.opencode/skills/data-collector/SKILL.md."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-log
          path: |
            fetch-log.md
            fetched-data.json
          if-no-files-found: warn
