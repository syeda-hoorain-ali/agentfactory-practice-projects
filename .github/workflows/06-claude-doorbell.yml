name: doorbell-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'loop-engineering/06-the-doorbell-loop/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: "Follow the skill at loop-engineering/06-the-doorbell-loop/.claude/skills/doorbell-review/SKILL.md to review this pull request."
